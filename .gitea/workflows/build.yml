name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest-slim
    container: node:22.13.0-bookworm
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v3
        with:
          name: next-build
          path: .next
          include-hidden-files: true
          retention-days: 3

  test:
    needs: build
    runs-on: ubuntu-latest-slim
    container: node:22.13.0-bookworm
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Download production build
        uses: actions/download-artifact@v3
        with:
          name: next-build
          path: .next

      - name: Verify production build
        run: test -f .next/BUILD_ID

      - name: Lint
        run: |
          mkdir -p test-artifacts
          npx eslint . --ignore-pattern dist --ignore-pattern .next \
            --format json --output-file test-artifacts/eslint.json

      - name: Upload lint report
        uses: actions/upload-artifact@v3
        with:
          name: lint-report
          path: test-artifacts/eslint.json
          retention-days: 7

  test-e2e:
    needs: build
    runs-on: ubuntu-latest-slim
    container: node:22.13.0-bookworm
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Download production build
        uses: actions/download-artifact@v3
        with:
          name: next-build
          path: .next

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload end-to-end report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: e2e-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

  publish-image:
    needs:
      - test
      - test-e2e
    if: gitea.event_name == 'push' && startsWith(gitea.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Docker CLI
        shell: sh
        run: |
          apt-get update
          apt-get install --yes docker.io
          docker version

      - name: Build and push image
        shell: sh
        env:
          GITEA_ACTOR: ${{ gitea.actor }}
          GITEA_REPOSITORY_OWNER: ${{ gitea.repository_owner }}
          GITEA_SERVER_URL: ${{ gitea.server_url }}
          IMAGE_BRANCH: ${{ gitea.ref_name }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          registry="${GITEA_SERVER_URL#https://}"
          registry="${registry#http://}"
          image="${registry}/${GITEA_REPOSITORY_OWNER}/magica-viewer"
          branch_tag="$(printf '%s' "${IMAGE_BRANCH}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's#[^a-z0-9_.-]#-#g')"

          printf '%s' "${REGISTRY_TOKEN}" \
            | docker login "${registry}" --username "${GITEA_ACTOR}" --password-stdin
          docker build --provenance=false --tag "${image}:${branch_tag}" .
          docker push "${image}:${branch_tag}"
