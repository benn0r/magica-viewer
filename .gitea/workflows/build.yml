name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Set package version
        if: gitea.event_name == 'push'
        env:
          REF_NAME: ${{ gitea.ref_name }}
          REF_TYPE: ${{ gitea.ref_type }}
          RUN_NUMBER: ${{ gitea.run_number }}
        run: |
          SAFE_REF="$(printf '%s' "$REF_NAME" | sed -E 's/[^A-Za-z0-9._+-]+/-/g; s/^-+|-+$//g')"
          if [ "$REF_TYPE" = "tag" ]; then
            PACKAGE_VERSION="$SAFE_REF"
          else
            PACKAGE_VERSION="${SAFE_REF}-run.${RUN_NUMBER}"
          fi
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "PACKAGE_FILE=magica-viewer-${PACKAGE_VERSION}.tar.gz" >> "$GITHUB_ENV"

      - name: Package build
        if: gitea.event_name == 'push'
        run: tar -czf "$PACKAGE_FILE" dist

      - name: Publish package
        if: gitea.event_name == 'push'
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
          PACKAGE_OWNER: ${{ gitea.repository_owner }}
          SERVER_URL: ${{ gitea.server_url }}
        run: |
          curl --fail-with-body \
            --user "${PACKAGE_OWNER}:${PACKAGE_TOKEN}" \
            --upload-file "$PACKAGE_FILE" \
            "${SERVER_URL}/api/packages/${PACKAGE_OWNER}/generic/magica-viewer/${PACKAGE_VERSION}/${PACKAGE_FILE}"
